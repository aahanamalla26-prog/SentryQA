name: SentryQA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run API tests
        run: dotnet test SentryQA.ApiTests --no-build --configuration Release --logger "trx;LogFileName=api-results.trx"

      - name: Run UI tests
        run: dotnet test SentryQA.UITests --no-build --configuration Release --logger "trx;LogFileName=ui-results.trx"
        # Note: UI tests need a headless Chrome setup in CI.
        # Add this step above if not already handled in your test setup:
        # - name: Setup Chrome
        #   uses: browser-actions/setup-chrome@latest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
